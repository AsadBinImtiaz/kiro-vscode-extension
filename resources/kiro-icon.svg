<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="128" height="128" rx="28" fill="url(#grad)"/>
  
  <!-- Geometric accents -->
  <circle cx="20" cy="20" r="3" fill="white" opacity="0.3"/>
  <circle cx="108" cy="108" r="3" fill="white" opacity="0.3"/>
  <circle cx="108" cy="20" r="2" fill="white" opacity="0.2"/>
  <circle cx="20" cy="108" r="2" fill="white" opacity="0.2"/>
  
  <!-- Circuit lines -->
  <line x1="20" y1="20" x2="40" y2="20" stroke="white" stroke-width="1" opacity="0.2"/>
  <line x1="88" y1="108" x2="108" y2="108" stroke="white" stroke-width="1" opacity="0.2"/>
  
  <!-- AI text with glow -->
  <text x="64" y="72" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="white" text-anchor="middle" filter="url(#glow)" letter-spacing="2">AI</text>
  
  <!-- kiro text with shadow -->
  <text x="64" y="105" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle" filter="url(#shadow)" letter-spacing="3" opacity="0.95">KIRO</text>
  
  <!-- Sparkle accents -->
  <circle cx="35" cy="50" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="93" cy="55" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="50" cy="90" r="1" fill="white" opacity="0.6"/>
  <circle cx="78" cy="88" r="1" fill="white" opacity="0.6"/>
</svg>
